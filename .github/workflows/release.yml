name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-X main.version=${{ github.ref_name }}" -o dist/dibs .
          tar -czf dist/dibs-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C dist dibs
          rm dist/dibs
      - uses: actions/upload-artifact@v4
        with:
          name: dibs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
      - name: Build changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "${{ github.ref_name }}" | head -n1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="${{ github.ref_name }}"
          else
            RANGE="$PREV_TAG..${{ github.ref_name }}"
          fi
          {
            echo "body<<EOF"
            git log --oneline --no-merges "$RANGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
